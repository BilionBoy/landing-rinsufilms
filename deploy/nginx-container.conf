# Nginx de dentro do container (roda sem root, porta 8080). O site é só leitura:
# aceita GET/HEAD, não executa nada no servidor e manda cabeçalhos de segurança.

server_tokens off;

# Limite por visitante. O Nginx do host repassa o IP real do visitante
# (CF-Connecting-IP da Cloudflare) em X-Real-IP.
limit_req_zone  $http_x_real_ip zone=por_ip:10m rate=20r/s;
limit_conn_zone $http_x_real_ip zone=conexoes:10m;

map $request_uri $cache_control {
    default                                   "public, max-age=604800";
    ~*\.(css|js)\?v=                          "public, max-age=31536000, immutable";
    ~*\.(ttf|woff2?)$                         "public, max-age=31536000, immutable";
    ~*(^/$|\.html$)                           "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip_static on;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;

    limit_req  zone=por_ip burst=60 nodelay;
    limit_conn conexoes 30;
    limit_req_status 429;
    limit_conn_status 429;

    # Site estático: qualquer método além de leitura é recusado.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Cabeçalhos de segurança (valem para toda resposta, inclusive erros).
    #  - script-src 'self': só roda o app.js do próprio site; script injetado,
    #    inline, eval e de outro domínio são bloqueados pelo navegador.
    #  - style-src permite 'unsafe-inline' só por causa dos atributos style=""
    #    dos recortes de imagem (CSS não executa código).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Nada de arquivo oculto (.git, .env, .DS_Store...).
    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
