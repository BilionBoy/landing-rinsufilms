# /etc/nginx/sites-available/rinsufilms.com.br — Nginx do host (VPS dhionux).
# Só escuta HTTP na 80, que o UFW libera apenas para os IPs da Cloudflare.
# O TLS é da Cloudflare (modo Flexible, igual aos outros sites desta VPS).
server {
    listen 80;
    listen [::]:80;
    server_name rinsufilms.com.br www.rinsufilms.com.br;

    server_tokens off;
    client_max_body_size 1k;

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        # IP real do visitante (só a Cloudflare chega aqui, então o cabeçalho é confiável)
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
}
