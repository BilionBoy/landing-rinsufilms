# R Insulfilms — landing estática. Porta só em localhost; o Nginx do host faz o proxy.
services:
  web:
    build: .
    image: rinsufilms-web:latest
    container_name: rinsufilms_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:8080"
    # Endurecimento do container: sistema de arquivos só leitura, sem root,
    # sem nenhuma capability do Linux, sem ganho de privilégio.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "101:101"
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
